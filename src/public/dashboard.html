<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MCP Hub - Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #jobs { width: 40%; float: left; }
    #details { width: 55%; float: right; }
    pre { background:#111; color:#0f0; padding:10px; height:400px; overflow:auto; white-space: pre-wrap; }
    li { cursor: pointer; padding:6px; border-bottom: 1px solid #eee; }
    li:hover { background:#f0f0f0; }
    .status { font-weight: bold; margin-left:8px; }
  </style>
</head>
<body>
  <h1>MCP Hub - Dashboard</h1>

  <div id="controls">
    <button id="refresh">Refresh</button>
    <button id="new">Trigger Demo Build</button>
  </div>

  <div id="jobs">
    <h2>Jobs</h2>
    <ul id="jobList"></ul>
  </div>

  <div id="details">
    <h2>Job Details</h2>
    <div id="jobMeta"></div>
    <h3>Logs</h3>
    <pre id="logs">Select a job to see logs</pre>
  </div>

<script>
const apiBase = '';

async function fetchJobs(){
  const res = await fetch(apiBase + '/jobs');
  const json = await res.json();
  return json.jobs || [];
}

function renderJobs(jobs){
  const ul = document.getElementById('jobList');
  ul.innerHTML = '';
  jobs.forEach(j => {
    const li = document.createElement('li');
    li.textContent = (j.name || j._id) + ' ';
    const span = document.createElement('span');
    span.textContent = j.status;
    span.className = 'status';
    li.appendChild(span);
    li.onclick = () => loadJob(j._id);
    ul.appendChild(li);
  });
}

async function loadJob(id){
  const res = await fetch(apiBase + '/jobs/' + id);
  const json = await res.json();
  const job = json.job;
  const meta = document.getElementById('jobMeta');
  meta.innerHTML = '<b>ID:</b> ' + job._id + '<br/>' + '<b>Status:</b> ' + job.status + '<br/>' + '<b>Created:</b> ' + new Date(job.createdAt).toLocaleString();
  const logs = document.getElementById('logs');
  logs.textContent = job.logs.map(l => '[' + new Date(l.ts).toLocaleTimeString() + '] ' + l.message).join('\n\n');
}

document.getElementById('refresh').onclick = async () => {
  const jobs = await fetchJobs();
  renderJobs(jobs);
};

document.getElementById('new').onclick = async () => {
  const body = {
    name: 'demo-' + Date.now(),
    repo: 'https://example.com/repo.git',
    commit: 'abcdef',
    commands: ['echo building', 'node -v', 'npm -v']
  };
  const res = await fetch(apiBase + '/trigger', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const json = await res.json();
  if (json.ok) {
    document.getElementById('refresh').click();
  } else {
    alert('Error: ' + JSON.stringify(json));
  }
};

window.onload = () => {
  document.getElementById('refresh').click();
  // auto-refresh every 5 seconds to see log updates
  setInterval(()=> document.getElementById('refresh').click(), 5000);
};
</script>
</body>
</html>
